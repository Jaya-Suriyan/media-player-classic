# Production-like stack: API + web app, MongoDB, and (optional) MinIO for S3-style storage.
#   cp server/.env.example .env   # then edit JWT_SECRET / ADMIN_* (and S3_* if used)
#   docker compose up -d --build
#   docker compose --profile s3 up -d   # also start MinIO
services:
  app:
    build: .
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      DATA_DIR: /data
    ports:
      - "3000:3000"
    volumes:
      - media:/data
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo:/data/db
    restart: unless-stopped

  minio:
    profiles: ["s3"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  media:
  mongo:
  minio:
